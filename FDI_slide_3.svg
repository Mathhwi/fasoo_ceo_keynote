<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="wfTitle wfDesc">
  <title id="wfTitle">Workforce Transformation</title>
  <desc id="wfDesc">Stage 1: 3명이 Job 1·2·3을 맡고 AI Assistant가 돕는다. Stage 2: Job 3을 AI Agent에 맡기고 사람 1명이 새로운 업무로 이동한다. Stage 3: Workforce 2가 새로 생기고 사람이 새로운 업무를 시작하며 Business Innovation이 시작된다.</desc>

  <style>
    .t1 { font: 700 22px 'Pretendard','Apple SD Gothic Neo','Inter',sans-serif; fill: #142a72; }
    .t2 { font: 500 13px 'Pretendard',sans-serif; fill: #334673; }
    .pnum { font: 800 11px 'Inter',sans-serif; fill: #4a6a00; letter-spacing: 2px; }
    .ptitle { font: 700 16px 'Pretendard',sans-serif; fill: #142a72; }
    .pdesc { font: 400 12.5px 'Pretendard',sans-serif; fill: #334673; }
    .wflabel { font: 700 12px 'Pretendard','Inter',sans-serif; fill: #1e3fa8; letter-spacing: 1px; }
    .wflabel2 { font: 700 12px 'Pretendard','Inter',sans-serif; fill: #4a6a00; letter-spacing: 1px; }
    .joblabel { font: 600 11px 'Pretendard',sans-serif; fill: #1e3fa8; }
    .joblabelA { font: 600 11px 'Pretendard',sans-serif; fill: #4a6a00; }
    .aitext { font: 800 8px 'Inter',sans-serif; fill: #0a1742; }
    .newbadge { font: 800 9px 'Inter',sans-serif; fill: #0a1742; }
    .note { font: 500 11px 'Pretendard',sans-serif; fill: #6b7a99; }
  </style>

  <defs>
    <!-- Person -->
    <g id="p">
      <circle cx="0" cy="-10" r="5" fill="#4a6ddb"/>
      <rect x="-7" y="-4" width="14" height="14" rx="3" fill="#4a6ddb"/>
    </g>
    <!-- Ghost person (in transit) -->
    <g id="pg">
      <circle cx="0" cy="-10" r="5" fill="#a8c0f1"/>
      <rect x="-7" y="-4" width="14" height="14" rx="3" fill="#a8c0f1"/>
    </g>
    <!-- AI Assistant bubble -->
    <g id="ai">
      <circle cx="0" cy="0" r="8" fill="#b8e23d" stroke="#4a6a00" stroke-width="0.7"/>
      <text class="aitext" x="0" y="2.8" text-anchor="middle">AI</text>
    </g>
    <!-- AI Agent robot -->
    <g id="ag">
      <rect x="-9" y="-13" width="18" height="12" rx="2.5" fill="#1e3fa8"/>
      <circle cx="-4" cy="-7" r="1.6" fill="#b8e23d"/>
      <circle cx="4" cy="-7" r="1.6" fill="#b8e23d"/>
      <rect x="-8" y="-1" width="16" height="12" rx="2" fill="#142a72"/>
      <line x1="-4" y1="5" x2="4" y2="5" stroke="#b8e23d" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="0" y1="-17" x2="0" y2="-13" stroke="#1e3fa8" stroke-width="1.5"/>
      <circle cx="0" cy="-18" r="1.6" fill="#b8e23d"/>
    </g>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a6ddb"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7a99"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#f8faff"/>

  <!-- Header -->
  <text class="t1" x="450" y="38" text-anchor="middle">Workforce Transformation</text>
  <text class="t2" x="450" y="60" text-anchor="middle">AI Assistant → AI Agent → 사람이 새로운 업무로 이동, Business Innovation 시작</text>

  <!-- ================== PANEL 1 ================== -->
  <g transform="translate(15, 90)">
    <rect x="0" y="0" width="280" height="430" rx="14" fill="#ffffff" stroke="#dbe3f2"/>
    <path d="M0,14 A14,14 0 0,1 14,0 L266,0 A14,14 0 0,1 280,14 L280,46 L0,46 Z" fill="#eef3fd"/>
    <text class="pnum" x="20" y="22">STAGE 1</text>
    <text class="ptitle" x="20" y="40">AI Assistant</text>

    <!-- Workforce 1 -->
    <rect x="20" y="66" width="240" height="300" rx="10" fill="#f3f7fe" stroke="#4a6ddb" stroke-width="1.5"/>
    <text class="wflabel" x="140" y="86" text-anchor="middle">WORKFORCE 1</text>

    <!-- Job 1 -->
    <rect x="40" y="98" width="200" height="78" rx="8" fill="#ffffff" stroke="#a8c0f1"/>
    <text class="joblabel" x="52" y="116">Job 1</text>
    <use href="#p" x="110" y="150"/>
    <use href="#ai" x="138" y="145"/>

    <!-- Job 2 -->
    <rect x="40" y="184" width="200" height="78" rx="8" fill="#ffffff" stroke="#a8c0f1"/>
    <text class="joblabel" x="52" y="202">Job 2</text>
    <use href="#p" x="110" y="236"/>
    <use href="#ai" x="138" y="231"/>

    <!-- Job 3 -->
    <rect x="40" y="270" width="200" height="78" rx="8" fill="#ffffff" stroke="#a8c0f1"/>
    <text class="joblabel" x="52" y="288">Job 3</text>
    <use href="#p" x="110" y="322"/>
    <use href="#ai" x="138" y="317"/>

    <!-- Description -->
    <text class="pdesc" x="140" y="390" text-anchor="middle">사람 3명이 각자의 일을 맡고,</text>
    <text class="pdesc" x="140" y="408" text-anchor="middle">AI Assistant가 옆에서 돕는 단계.</text>
  </g>

  <!-- Arrow 1 → 2 -->
  <line x1="300" y1="305" x2="313" y2="305" stroke="#4a6ddb" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- ================== PANEL 2 ================== -->
  <g transform="translate(315, 90)">
    <rect x="0" y="0" width="280" height="430" rx="14" fill="#ffffff" stroke="#dbe3f2"/>
    <path d="M0,14 A14,14 0 0,1 14,0 L266,0 A14,14 0 0,1 280,14 L280,46 L0,46 Z" fill="#eef3fd"/>
    <text class="pnum" x="20" y="22">STAGE 2</text>
    <text class="ptitle" x="20" y="40">AI Agent 투입</text>

    <!-- Workforce 1 -->
    <rect x="20" y="66" width="240" height="300" rx="10" fill="#f3f7fe" stroke="#4a6ddb" stroke-width="1.5"/>
    <text class="wflabel" x="140" y="86" text-anchor="middle">WORKFORCE 1</text>

    <!-- Job 1 -->
    <rect x="40" y="98" width="200" height="78" rx="8" fill="#ffffff" stroke="#a8c0f1"/>
    <text class="joblabel" x="52" y="116">Job 1</text>
    <use href="#p" x="110" y="150"/>
    <use href="#ai" x="138" y="145"/>

    <!-- Job 2 -->
    <rect x="40" y="184" width="200" height="78" rx="8" fill="#ffffff" stroke="#a8c0f1"/>
    <text class="joblabel" x="52" y="202">Job 2</text>
    <use href="#p" x="110" y="236"/>
    <use href="#ai" x="138" y="231"/>

    <!-- Job 3 now handed off to AI Agent -->
    <rect x="40" y="270" width="200" height="78" rx="8" fill="#fff6df" stroke="#e4c555" stroke-dasharray="4,3"/>
    <text class="joblabelA" x="52" y="288">Job 3</text>
    <use href="#ag" x="125" y="330"/>
    <text class="note" x="155" y="318">AI Agent가 수행,</text>
    <text class="note" x="155" y="334">사람이 감독·관리</text>

    <!-- Person 3 exits with arrow -->
    <g transform="translate(40, 388)">
      <use href="#pg" x="15" y="0"/>
      <line x1="32" y1="-2" x2="105" y2="-2" stroke="#6b7a99" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#ahg)"/>
      <text class="note" x="112" y="2">새 업무로 이동</text>
    </g>

    <text class="pdesc" x="140" y="418" text-anchor="middle">한 명이 새로운 일에 투입 가능해진다.</text>
  </g>

  <!-- Arrow 2 → 3 -->
  <line x1="600" y1="305" x2="613" y2="305" stroke="#4a6ddb" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- ================== PANEL 3 ================== -->
  <g transform="translate(615, 90)">
    <rect x="0" y="0" width="280" height="430" rx="14" fill="#ffffff" stroke="#dbe3f2"/>
    <path d="M0,14 A14,14 0 0,1 14,0 L266,0 A14,14 0 0,1 280,14 L280,46 L0,46 Z" fill="#eef3fd"/>
    <text class="pnum" x="20" y="22">STAGE 3</text>
    <text class="ptitle" x="20" y="40">Workforce 확장</text>

    <!-- Workforce 1 (compact) -->
    <rect x="20" y="66" width="240" height="120" rx="10" fill="#f3f7fe" stroke="#4a6ddb" stroke-width="1.5"/>
    <text class="wflabel" x="140" y="84" text-anchor="middle">WORKFORCE 1</text>

    <rect x="32" y="96" width="68" height="78" rx="6" fill="#ffffff" stroke="#a8c0f1"/>
    <text class="joblabel" x="66" y="112" text-anchor="middle">Job 1</text>
    <use href="#p" x="60" y="152"/>
    <use href="#ai" x="83" y="148"/>

    <rect x="106" y="96" width="68" height="78" rx="6" fill="#fff6df" stroke="#e4c555" stroke-dasharray="4,3"/>
    <text class="joblabelA" x="140" y="112" text-anchor="middle">Job 2</text>
    <use href="#ag" x="140" y="154"/>

    <rect x="180" y="96" width="68" height="78" rx="6" fill="#fff6df" stroke="#e4c555" stroke-dasharray="4,3"/>
    <text class="joblabelA" x="214" y="112" text-anchor="middle">Job 3</text>
    <use href="#ag" x="214" y="154"/>

    <!-- Down arrow (resource flow) -->
    <line x1="140" y1="190" x2="140" y2="208" stroke="#4a6a00" stroke-width="2" marker-end="url(#ah)"/>

    <!-- Workforce 2 (NEW) -->
    <rect x="20" y="214" width="240" height="152" rx="10" fill="#f5fae3" stroke="#4a6a00" stroke-width="1.5"/>
    <g transform="translate(140, 234)">
      <text class="wflabel2" x="-18" y="0" text-anchor="middle">WORKFORCE 2</text>
      <rect x="28" y="-10" width="34" height="14" rx="7" fill="#b8e23d"/>
      <text class="newbadge" x="45" y="0" text-anchor="middle">NEW</text>
    </g>

    <rect x="36" y="250" width="96" height="100" rx="8" fill="#ffffff" stroke="#c8de66"/>
    <text class="joblabelA" x="84" y="268" text-anchor="middle">New Job A</text>
    <use href="#p" x="72" y="320"/>
    <use href="#ai" x="100" y="315"/>

    <rect x="148" y="250" width="96" height="100" rx="8" fill="#ffffff" stroke="#c8de66"/>
    <text class="joblabelA" x="196" y="268" text-anchor="middle">New Job B</text>
    <use href="#p" x="184" y="320"/>
    <use href="#ai" x="212" y="315"/>

    <text class="pdesc" x="140" y="388" text-anchor="middle">사람이 새로운 업무를 시작하며,</text>
    <text class="pdesc" x="140" y="406" text-anchor="middle">Business Innovation이 시작된다.</text>
  </g>

  <!-- Legend -->
  <g transform="translate(0, 548)">
    <rect x="120" y="0" width="660" height="44" rx="14" fill="#ffffff" stroke="#dbe3f2"/>
    <g transform="translate(160, 22)">
      <use href="#p" x="0" y="0"/>
      <text class="pdesc" x="16" y="4">사람</text>
    </g>
    <g transform="translate(250, 22)">
      <use href="#ai" x="0" y="0"/>
      <text class="pdesc" x="14" y="4">AI Assistant (보조)</text>
    </g>
    <g transform="translate(420, 22)">
      <use href="#ag" x="0" y="0"/>
      <text class="pdesc" x="16" y="4">AI Agent (자율 수행)</text>
    </g>
    <g transform="translate(620, 22)">
      <rect x="-10" y="-8" width="20" height="16" rx="3" fill="#fff6df" stroke="#e4c555" stroke-dasharray="3,2"/>
      <text class="pdesc" x="18" y="4">Agent 수행 Job</text>
    </g>
  </g>
</svg>
